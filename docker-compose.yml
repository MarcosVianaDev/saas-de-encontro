name: saas-de-encontro
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    MEDIA_USE_X_ACCEL_REDIRECT: ${MEDIA_USE_X_ACCEL_REDIRECT:-1}
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  backend:
    <<: *backend
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); from django.conf import settings; host=next((h.lstrip('.') for h in settings.ALLOWED_HOSTS if '*' not in h), 'localhost'); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':host, 'X-Forwarded-Proto':'https'}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  celery_worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=info, --concurrency=1, --queues=celery, --hostname=default@%h, --prefetch-multiplier=1]
    healthcheck:
      test: [CMD-SHELL, "celery -A config inspect ping --destination default@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
  celery_exports:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=info, --concurrency=1, --queues=exports, --hostname=exports@%h, --prefetch-multiplier=1]
    stop_grace_period: 10m
    healthcheck:
      test: [CMD-SHELL, "celery -A config inspect ping --destination exports@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
  celery_beat:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_FRONTEND_DATA_MODE: ${FRONTEND_DATA_MODE:-mock}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  db:
    image: postgres:18-bookworm
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/app-routes.conf:/etc/nginx/app-routes.conf:ro
      - ./backend/media:/srv/private-media:ro
      - ./backend/staticfiles:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/static/admin/css/base.css]
      interval: 10s
      timeout: 5s
      retries: 12
  traefik:
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yml
      - --ping=true
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/traefik.yml:/etc/traefik/routes.yml:ro
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
  redis_data:
  frontend_modules:
