events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Traefik supplies the original scheme and discards untrusted forwarded
    # headers at the public edge. Never forward an arbitrary scheme to Django.
    map $http_x_forwarded_proto $original_scheme {
        default $scheme;
        https https;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 80;
        client_max_body_size 12m;
        include /etc/nginx/app-routes.conf;
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
