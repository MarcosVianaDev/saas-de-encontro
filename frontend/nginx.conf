server {
    listen 80;
    root /usr/share/nginx/html/login;
    index index.html;
    charset utf-8;
    # Keep redirects relative behind the HTTPS gateway.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    # Never retain authenticated code in a shared browser/CDN cache.
    add_header Cache-Control "private, no-store" always;

    location = /_authorize-participant {
        internal;
        proxy_pass http://backend:8000/api/frontend/authorize/?audience=participant;
        include /etc/nginx/spa-auth-proxy.conf;
    }
    location = /_authorize-event-manager {
        internal;
        proxy_pass http://backend:8000/api/frontend/authorize/?audience=event-manager;
        include /etc/nginx/spa-auth-proxy.conf;
    }
    location = /_authorize-global {
        internal;
        proxy_pass http://backend:8000/api/frontend/authorize/?audience=global;
        include /etc/nginx/spa-auth-proxy.conf;
    }
    location ^~ /spa/participant/ {
        root /usr/share/nginx/html;
        auth_request /_authorize-participant;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
    }
    location ^~ /spa/event-manager/ {
        root /usr/share/nginx/html;
        auth_request /_authorize-event-manager;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
    }
    location ^~ /spa/global/ {
        root /usr/share/nginx/html;
        auth_request /_authorize-global;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
    }
    location @login { return 302 /; }
    location /spa/ { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /images/ { try_files $uri =404; }
    # Block source, manifests, maps and alternate HTML/internal paths.
    location ~* \.(?:js|css|map|json|tsx?|html|conf|mjs)$ { return 404; }
    location / { try_files $uri /index.html; }
}
